name: Build Windows packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build portable app, installer, and Python distributions
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneNumberGenerator-Windows
          path: release/*
          if-no-files-found: error
